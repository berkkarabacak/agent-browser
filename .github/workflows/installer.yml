name: installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install the Windows cross toolchain and NSIS
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 nsis
      - name: Build AgentBrowserSetup.exe
        run: make installer
      - uses: actions/upload-artifact@v4
        with:
          name: AgentBrowserSetup
          path: dist/AgentBrowserSetup.exe
